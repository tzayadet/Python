name: Python syntax checks

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/python-checks.yml"
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/python-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q -x FirmaAutomatizadaALPHA .
